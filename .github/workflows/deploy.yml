name: Deploy

# Fluxo automático:
# push na main -> build -> migrations -> GitHub Pages.
#
# Não é necessário abrir a Lovable para publicar o site.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Instalar dependências
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Preparar artifact do GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  migrations:
    name: Banco de dados
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar migrations (se SUPABASE_DB_URL estiver configurada)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "SUPABASE_DB_URL não configurada — pulando aplicação de migrations."
            exit 0
          fi

          curl -fsSL https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz \
            | tar -xz -C /usr/local/bin supabase

          supabase db push \
            --db-url "$SUPABASE_DB_URL" \
            --include-all

  publish:
    name: Publicar site
    needs: [build, migrations]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4